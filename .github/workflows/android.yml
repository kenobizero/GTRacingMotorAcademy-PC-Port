# Builds the Android APK (android/README.md) on GitHub's machines.
#
# It needs the game's program (GTRacingFreemiumHD, the file inside GTRacingFreemiumHD.app, version 1.3.4b), which
# is never in this repository.  Either of:
#   - a PRIVATE repository of yours named gtracing-game with that file at its top (and, for the port's menu pages,
#     the game's menu files MZlN_MiNH_*.FAK and LHBMiNHF*.FAK next to it), and the secret
#     GAME_REPO_TOKEN: a token that can read it (in Termux: gh secret set GAME_REPO_TOKEN --body "$(gh auth token)");
#   - the secret GAME_EXE_URL: a direct-download link to the file.
# Only that one file is needed to build; the game's other files stay on your phone.  Two APKs are left as the
# run's artifacts (Actions > the run > Artifacts):
#   GTRacing-android-apk        32-bit and 64-bit in one (a phone takes its own: 64-bit when it can; the
#                               Snapdragon 8 Gen 3 and later run 64-bit only)
#   GTRacing-android-apk-32bit  32-bit only (the same build without its 64-bit libraries)
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-port]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Which source has the game's program
        id: src
        env:
          GAME_REPO_TOKEN: ${{ secrets.GAME_REPO_TOKEN }}
          GAME_EXE_URL: ${{ secrets.GAME_EXE_URL }}
        run: |
          if [ -n "$GAME_REPO_TOKEN" ]; then echo "from=repo" >> "$GITHUB_OUTPUT"
          elif [ -n "$GAME_EXE_URL" ]; then echo "from=url" >> "$GITHUB_OUTPUT"
          else echo "from=none" >> "$GITHUB_OUTPUT"; fi

      - name: The game's program from the private repository gtracing-game
        if: steps.src.outputs.from == 'repo'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gtracing-game
          token: ${{ secrets.GAME_REPO_TOKEN }}
          path: gtracing-game

      - name: The game's program (checked)
        id: game
        env:
          FROM: ${{ steps.src.outputs.from }}
          GAME_EXE_URL: ${{ secrets.GAME_EXE_URL }}
        run: |
          if [ "$FROM" = none ]; then
            echo "::warning::No GAME_REPO_TOKEN or GAME_EXE_URL secret: nothing to build (see the top of .github/workflows/android.yml)"
            echo "ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p GTRacingFreemiumHD.app
          if [ "$FROM" = repo ]; then
            mv gtracing-game/GTRacingFreemiumHD GTRacingFreemiumHD.app/GTRacingFreemiumHD
            # the game's menu files, when the private repository has them: patched into the APK (the menu pages)
            if ls gtracing-game/*.FAK > /dev/null 2>&1; then
              cp gtracing-game/*.FAK GTRacingFreemiumHD.app/
              echo "menu files: $(ls gtracing-game/*.FAK | wc -l)"
            else
              echo "::notice::No .FAK menu files in gtracing-game: the APK has no menu pages (Display, Exit, Name)"
            fi
            rm -rf gtracing-game
          else
            curl -fsSL --retry 3 -o GTRacingFreemiumHD.app/GTRacingFreemiumHD "$GAME_EXE_URL"
          fi
          if ! echo "eaeca1915d8b0a250583afed587f61ecb85a728a  GTRacingFreemiumHD.app/GTRacingFreemiumHD" | sha1sum -c --quiet -; then
            echo "::error::The file is not GTRacingFreemiumHD 1.3.4b (wrong SHA-1; with GAME_EXE_URL: a share page instead of the file itself?)"
            head -c 200 GTRacingFreemiumHD.app/GTRacingFreemiumHD | strings | head -3
            exit 1
          fi
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.game.outputs.ok == '1'
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        if: steps.game.outputs.ok == '1'
        with:
          distribution: temurin
          java-version: '17'

      - name: Python packages, NDK, CMake
        if: steps.game.outputs.ok == '1'
        run: |
          pip install "capstone>=5,<6"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Cache stage 1 and 2 (the generated code; rebuilt when recomp/ changes)
        if: steps.game.outputs.ok == '1'
        uses: actions/cache@v4
        with:
          path: |
            analysis/stage1
            build/gen
          key: gen-${{ hashFiles('recomp/**') }}

      - name: Generated code, bridges, SDL 3
        if: steps.game.outputs.ok == '1'
        run: python -I android/prepare.py

      - name: The menu pages into the APK
        if: steps.game.outputs.ok == '1'
        run: |
          if [ -d build/android/patch ]; then
            mkdir -p android/app/src/main/assets/gtpatch
            cp build/android/patch/*.FAK android/app/src/main/assets/gtpatch/
            ls -la android/app/src/main/assets/gtpatch
          fi

      - name: Build the APK
        if: steps.game.outputs.ok == '1'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: The two APKs (32 + 64-bit, and 32-bit only)
        if: steps.game.outputs.ok == '1'
        run: |
          out=android/app/build/outputs/apk/release
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p apk/both apk/32
          cp "$out/app-release.apk" apk/both/GTRacing-32-64bit.apk
          # 32-bit only: the 64-bit libraries out, aligned and signed again (the build's own debug key)
          cp "$out/app-release.apk" apk/tmp32.apk
          zip -q -d apk/tmp32.apk 'lib/arm64-v8a/*'
          "$bt/zipalign" -f -p 4 apk/tmp32.apk apk/aligned32.apk
          "$bt/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out apk/32/GTRacing-32bit.apk apk/aligned32.apk
          "$bt/apksigner" verify apk/32/GTRacing-32bit.apk
          unzip -l apk/both/GTRacing-32-64bit.apk | grep "lib/" || true
          ls -la apk/both apk/32

      - uses: actions/upload-artifact@v4
        if: steps.game.outputs.ok == '1'
        with:
          name: GTRacing-android-apk
          path: apk/both/*.apk
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.game.outputs.ok == '1'
        with:
          name: GTRacing-android-apk-32bit
          path: apk/32/*.apk
          retention-days: 7
          if-no-files-found: error
